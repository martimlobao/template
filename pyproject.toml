[project]
name = "foobar"
version = "0.1.0"
description = "All things foobar"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Martim Lobao", email = "dev@lobao.io" }]
dependencies = [
  "alembic>=1.18.4",
  "fastapi>=0.136.1",
  "psycopg[binary]>=3.3.3",
  "pydantic-settings>=2.13.0",
  "sqlalchemy>=2.0.46",
  "uvicorn>=0.41.0",
]

[project.scripts]
api = "foobar.api.main:main"
foobar = "foobar.main:main"

[dependency-groups]
dev = [
  "bandit>=1.8.6",
  "coverage>=7.10.6",
  "docformatter>=1.7.7",
  "httpx>=0.27.2",
  "hypothesis>=6.152.1",
  "ipython>=9.5.0",
  "pyright>=1.1.409",
  "pytest>=9.0.3",
  "pytest-cov>=7.0.0",
  "ruff>=0.15.10",
  "rumdl>=0.0.174",
  "tombi>=0.9.24",
  "ty>=0.0.31",
  "yamllint>=1.37.1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.alembic]
script_location = "%(here)s/migrations"
file_template = "%%(year)d%%(month).2d%%(day).2d%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]

[[tool.alembic.post_write_hooks]]
name = "ruff"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
executionEnvironments = [
  { root = "src", extraPaths = ["src", "."] },
  { root = "tests", extraPaths = ["src", "."], reportPrivateUsage = false },
]

[tool.pytest]
addopts = ["--cov-fail-under=100", "--cov=src"]
testpaths = [
  "tests",
]
