[project]
name = "foobar"
version = "0.1.0"
description = "All things foobar"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Martim Lobao", email = "dev@lobao.io" }]
dependencies = [
  "alembic>=1.18.4",
  "fastapi>=0.137.0",
  "psycopg[binary]>=3.3.4",
  "pydantic-settings>=2.14.2",
  "sqlalchemy>=2.0.51",
  "uvicorn>=0.49.0",
]

[project.scripts]
api = "foobar.api.main:main"
foobar = "foobar.main:main"

[dependency-groups]
dev = [
  "bandit>=1.8.6",
  "coverage>=7.14.2",
  "docformatter>=1.7.8",
  "httpx>=0.27.2",
  "httpx2>=2.4.0",
  "hypothesis>=6.152.7",
  "ipython>=9.13.0",
  "pyright>=1.1.410",
  "pytest>=9.1.1",
  "pytest-cov>=7.0.0",
  "ruff>=0.15.16",
  "rumdl>=0.2.20",
  "tombi>=1.0.0",
  "ty>=0.0.49",
  "yamllint>=1.37.1",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.alembic]
script_location = "%(here)s/migrations"
file_template = "%%(year)d%%(month).2d%%(day).2d%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]

[[tool.alembic.post_write_hooks]]
name = "ruff"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
executionEnvironments = [
  { root = "src", extraPaths = ["src", "."] },
  { root = "tests", extraPaths = ["src", "."], reportPrivateUsage = false },
]

[tool.pytest]
addopts = ["--cov-fail-under=100", "--cov=src"]
testpaths = [
  "tests",
]
